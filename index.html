<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World War 198X</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <aside id="hud">
      <header>
        <h1>WORLD WAR 198X</h1>
        <div class="sub">STRATEGIC COMMAND // ICBM FIRE CONTROL · <span id="build"></span></div>
      </header>

      <section>
        <h2>Command authority</h2>
        <div class="seg" id="sideSeg">
          <button data-side="USA" class="active">USA · SAC</button>
          <button data-side="USSR">USSR · RVSN</button>
        </div>
      </section>

      <section>
        <h2>Fire mission</h2>
        <label>Weapon <select id="weapon"></select></label>
        <label>Launch site <select id="launchSel"></select></label>
        <div class="row">
          <span id="launchCoord" class="coord"></span>
          <button id="pickLaunch" class="small">Pick on globe</button>
        </div>
        <div id="siteNote" class="coord"></div>
        <label>Targets <span id="rvCount" class="count"></span></label>
        <ol id="targetList"></ol>
        <div class="row">
          <select id="targetSel"></select>
          <button id="addTarget" class="small">Add</button>
          <button id="pickTarget" class="small">Pick on globe</button>
        </div>
        <label
          >Trajectory
          <select id="profile">
            <option value="minimum-energy">Minimum energy</option>
            <option value="lofted">Lofted (high, slow)</option>
            <option value="depressed">Depressed (low, fast)</option>
          </select>
        </label>
        <button id="computeBtn" class="primary">Compute firing solution</button>
      </section>

      <section id="solutionBox" hidden>
        <h2>Firing solution</h2>
        <dl id="solution"></dl>
        <table id="rvTable"></table>
        <button id="launchBtn" class="danger">Launch</button>
      </section>

      <section>
        <h2>Time warp</h2>
        <div class="seg" id="warpSeg"></div>
      </section>

      <section>
        <h2>Display</h2>
        <div class="seg" id="pictureSeg">
          <button data-picture="truth">Ground truth</button>
          <button data-picture="sensors">Enemy sensors</button>
        </div>
        <div class="row">
          <div id="legend" class="legend" hidden>
            <span style="--c: #ffe066">UNKNOWN</span><span style="--c: #ff4b4b">RV</span
            ><span style="--c: #8a9a93">DECOY</span><span style="--c: #5fd7ff">CHAFF</span>
          </div>
          <button id="sensorsBtn" class="small">Sensor coverage</button>
        </div>
      </section>

      <section>
        <h2>Camera</h2>
        <div class="seg" id="cameraSeg">
          <button data-view="globe">Globe</button>
          <button data-view="launch">Launch site</button>
          <button data-view="targets">Target area</button>
        </div>
      </section>

      <section>
        <h2>Telemetry</h2>
        <dl id="telemetry"><dt>No missiles in flight</dt></dl>
      </section>

      <section class="log">
        <h2>Event log</h2>
        <ol id="log"></ol>
      </section>
    </aside>

    <div id="pickHint" hidden>CLICK THE GLOBE TO DESIGNATE · ESC TO CANCEL</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
